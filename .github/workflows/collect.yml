name: איסוף המהדורה

on:
  schedule:
    # שעון UTC. ישראל = UTC+3 → כל שעה בדקה 17, מ-05:17 עד 23:17.
    # GitHub מדלג על חלק מהריצות המתוזמנות; ריצה כל שעה (ובדקה לא עגולה) מבטיחה שגם אחרי דילוגים יהיו כמה ביום.
    - cron: "17 2-20 * * *"
  push:
    branches: [main]
    paths: ["config.json", "index.html", "collect.py", "assets/**", ".github/workflows/collect.yml"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: איסוף
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FOOTBALL_DATA_KEY: ${{ secrets.FOOTBALL_DATA_KEY }}
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: python collect.py

      - name: שמירה בריפו
        run: |
          git config user.name "hamahadura-bot"
          git config user.email "hamahadura-bot@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then echo "אין שינוי"; exit 0; fi
          git commit -m "עדכון מהדורה $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do
            git pull --rebase -X theirs origin main && git push && exit 0
            sleep 5
          done
          exit 1

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deploy
        uses: actions/deploy-pages@v4
